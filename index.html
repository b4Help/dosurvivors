<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DOSurvivors</title>
<!-- Font: Px437/Web437 IBM VGA 8x16 by VileR, int10h.org, CC BY-SA 4.0 (see FONT-LICENSE.txt) -->
<style>
@font-face{font-family:VGA;src:url(Web437_IBM_VGA_8x16.woff) format('woff');font-display:block}
:root{--fs:16px;--sfs:16px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font-family:VGA,'Courier New',monospace;font-size:var(--fs);line-height:1;color:#AAAAAA;-webkit-font-smoothing:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;white-space:pre;overflow:hidden;height:var(--fs);z-index:5;display:none}
#top{top:0;background:#0000AA;color:#FFFFFF}
#xpb{top:var(--fs);background:#000;color:#AAAAAA}
#bossb{top:calc(var(--fs)*2);background:#000;color:#FF5555}
#bot{bottom:0;background:#00AAAA;color:#000}
.scr{position:fixed;inset:0;z-index:10;display:none;background:#000;color:#AAAAAA;font-size:var(--sfs);padding:1em .5em;white-space:pre;overflow:hidden;touch-action:manipulation}
[data-act]{cursor:pointer}
#ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.dlg{white-space:pre;background:#0000AA;color:#FFFFFF;box-shadow:var(--fs) var(--fs) 0 rgba(0,0,0,.8)}
.dlg.red{background:#AA0000}
.bt,.hl{color:#FFFF55}.dim{color:#AAAAAA}.cy{color:#55FFFF}.gr{color:#55FF55}.rd{color:#FF5555}.wh{color:#FFFFFF}.dg{color:#555555}.mg{color:#FF55FF}.bl{color:#5555FF}.yl{color:#FFFF55}
.sel{background:#AAAAAA;color:#0000AA}
[data-opt]{cursor:pointer}
.blink{animation:bl 1.06s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,0) 4px)}
#crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.55) 100%);animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:1}48%{opacity:.92}50%{opacity:1}74%{opacity:.96}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top" class="bar"></div>
<div id="xpb" class="bar"></div>
<div id="bossb" class="bar"></div>
<div id="bot" class="bar"></div>
<div id="scr" class="scr"></div>
<div id="ov"><div id="dlg" class="dlg"></div></div>
<div id="crt"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const C={black:'#000000',blue:'#0000AA',green:'#00AA00',cyan:'#00AAAA',red:'#AA0000',mag:'#AA00AA',brown:'#AA5500',lgray:'#AAAAAA',dgray:'#555555',lblue:'#5555FF',lgreen:'#55FF55',lcyan:'#55FFFF',lred:'#FF5555',lmag:'#FF55FF',yellow:'#FFFF55',white:'#FFFFFF'};
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=t=>{t=Math.floor(t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296}

/* ---------- screen ---------- */
const isTouch=(matchMedia&&matchMedia('(pointer: coarse)').matches)||navigator.maxTouchPoints>0||'ontouchstart' in window;
let W=0,H=0,DPR=1,ZOOM=2,UI=2,VW=960,VH=540,COLS=80,SFS=16,SCOLS=80;
function resize(){
  DPR=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ZOOM=Math.max(1,Math.min(3,Math.round(Math.min(W/960,H/560)*2)/2));
  VW=W/ZOOM;VH=H/ZOOM;
  UI=(W>=1300&&H>=800)?2:Math.min(1,W/(66*8));
  SFS=Math.min(16*Math.max(1,UI),W*2/82);
  document.documentElement.style.setProperty('--fs',(16*UI)+'px');
  document.documentElement.style.setProperty('--sfs',SFS+'px');
  COLS=Math.floor(W/(8*UI));SCOLS=Math.floor((W-SFS)/(SFS/2));
  lastHud={};
  if(state==='title')showTitle();else if(state==='help')showHelp();
}
addEventListener('resize',resize);

/* ---------- sound (PC speaker) ---------- */
let AC=null,muted=false;const lastBeep={};
function beep(f,d,v=.035,slide=0,delay=0,key=null,gap=0){
  if(muted)return;
  if(key){const n=performance.now();if(lastBeep[key]&&n-lastBeep[key]<gap)return;lastBeep[key]=n}
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type='square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const arp=(notes,step=.07,v=.04)=>notes.forEach((f,i)=>beep(f,step*1.4,v,0,i*step));

/* ---------- data ---------- */
const MSGS=['Bad command or file name','Abort, Retry, Fail?','File not found','Access denied','Not ready reading drive A','Insufficient memory','Invalid drive specification','General failure reading drive C','Divide overflow','Sector not found','Write protect error','Out of environment space','Path not found','Invalid parameter','Insufficient disk space','Packed file is corrupt','Required parameter missing','Invalid directory','Missing operating system','Keyboard error, press F1'];
const LIST=['AUTOEXEC BAT       512 10-06-94  9:41a','CONFIG   SYS       318 10-06-94  9:41a','COMMAND  COM    54,645 05-31-94  6:22a','HIMEM    SYS    29,136 05-31-94  6:22a','EMM386   EXE   120,926 05-31-94  6:22a','MOUSE    COM    56,408 03-10-93  6:00a','SMARTDRV EXE    45,145 05-31-94  6:22a','README   TXT    12,288 10-06-94 11:02a','DOSURV   EXE   640,000 10-06-94 11:03a','DOSURV   DAT 1,474,560 10-06-94 11:03a','TEMP         <DIR>    10-06-94  9:40a','UTILS        <DIR>    10-06-94  9:40a','GAMES        <DIR>    10-06-94  9:40a','  38 file(s)   2,412,544 bytes','Volume in drive C has no label','Directory of C:\\GAMES'];

const ET={
  'x':{name:'bug',     c:C.lgreen,hp:5,  spd:38,dmg:5, xp:1,r:5},
  '0':{name:'null ptr',c:C.lgray, hp:11, spd:33,dmg:6, xp:1,r:5},
  'E':{name:'error',   c:C.lred,  hp:18, spd:42,dmg:8, xp:2,r:5},
  '@':{name:'worm',    c:C.lcyan, hp:16, spd:62,dmg:7, xp:2,r:5},
  '#':{name:'corrupt sector',c:C.yellow,hp:55,spd:28,dmg:11,xp:3,r:6},
  '$':{name:'memory leak',c:C.green,hp:60,spd:44,dmg:12,xp:4,r:5},
  '&':{name:'fork',    c:C.lblue, hp:80, spd:48,dmg:13,xp:4,r:5},
  '%':{name:'overflow',c:C.white, hp:110,spd:40,dmg:15,xp:5,r:6},
  'W':{name:'boot virus',c:C.lmag,hp:200,spd:34,dmg:18,xp:8,r:7},
  // D:\ drive (LEVEL 2)
  'q':{name:'trojan',  c:C.brown,hp:40, spd:78,dmg:9, xp:3,r:5},
  'k':{name:'keylogger',c:C.mag,hp:70, spd:22,dmg:8, xp:4,r:5,shoot:{every:2.4,spd:110,dmg:9}},
  'Z':{name:'zip bomb',c:C.lblue,hp:120,spd:26,dmg:14,xp:6,r:7,burst:true},
};
const WAVES=[
  {t:['x'],rate:1.0,cap:60},
  {t:['x','0'],rate:1.8,cap:90},
  {t:['0','E','x'],rate:2.4,cap:120},
  {t:['E','@'],rate:3.0,cap:150},
  {t:['E','#','@'],rate:3.4,cap:180},
  {t:['#','$','0'],rate:3.9,cap:210},
  {t:['$','&','@'],rate:4.6,cap:250},
  {t:['&','%','#'],rate:5.3,cap:290},
  {t:['%','W','$'],rate:6.1,cap:330},
  {t:['W','%','&','@'],rate:7.0,cap:380},
];
// LEVEL 2 (D:\): same 10-minute shape, new processes mixed in from the first minute
const WAVES2=[
  {t:['q','x'],rate:1.4,cap:80},
  {t:['q','0','x'],rate:2.0,cap:110},
  {t:['k','E','q'],rate:2.6,cap:140},
  {t:['Z','#','k'],rate:3.0,cap:170},
  {t:['q','@','Z'],rate:3.6,cap:200},
  {t:['k','$','#','q'],rate:4.2,cap:230},
  {t:['Z','&','k'],rate:4.9,cap:260},
  {t:['q','%','Z','k'],rate:5.6,cap:300},
  {t:['k','W','q','Z'],rate:6.4,cap:340},
  {t:['W','%','q','k','Z'],rate:7.2,cap:380},
];
const MAXW=7;
const b=(c)=>c?1:0;
const WEAP={
  DIR:{name:'DIR',file:'DIR.COM',c:C.white,
    up:['Fires directory listings at the nearest process','+1 listing','+6 damage','+1 listing, +1 pierce','+6 damage','+1 listing, -20% delay','+10 damage, +1 pierce'],
    st:l=>({dmg:10+6*b(l>=3)+6*b(l>=5)+10*b(l>=7),n:1+b(l>=2)+b(l>=4)+b(l>=6),pierce:1+b(l>=4)+b(l>=7),cd:1.0*(l>=6?.8:1)}),
    fire(w,s){const t=nearest(PL.x,PL.y,300);const a0=t?Math.atan2(t.y-PL.y,t.x-PL.x):Math.atan2(PL.fy,PL.fx);const n=s.n+P.amount;
      for(let i=0;i<n;i++)shoot(PL.x,PL.y,a0+(i-(n-1)/2)*.14,200*P.pspd,{dmg:s.dmg,pierce:s.pierce,s:'<DIR>',c:C.white,r:8,kb:35});}},
  TYPE:{name:'TYPE',file:'TYPE.COM',c:C.lgray,
    up:['Prints a line of text in front of you','Also prints behind you','+8 damage','+30% length','+8 damage','-20% delay','+12 damage, +30% length'],
    st:l=>({dmg:14+8*b(l>=3)+8*b(l>=5)+12*b(l>=7),len:64*(1+.3*b(l>=4)+.3*b(l>=7)),both:l>=2,cd:1.35*(l>=6?.8:1)}),
    fire(w,s){const len=s.len*P.area,dirs=s.both?[PL.hx,-PL.hx]:[PL.hx],n=1+P.amount;
      for(const dir of dirs)for(let k=0;k<n;k++){const y=PL.y+(k===0?0:(k%2?-16:16)*Math.ceil(k/2));
        const x0=PL.x+dir*8,x1=x0+dir*len,mn=Math.min(x0,x1),mx=Math.max(x0,x1);
        query((mn+mx)/2,y,len/2,e=>{if(e.x+e.r>=mn&&e.x-e.r<=mx&&Math.abs(e.y-y)<=8+e.r)hurt(e,s.dmg,dir*60,0)});
        S.lines.push({x0,y,dir,len,txt:pick(MSGS),life:.45,max:.45});}
      beep(900,.03,.012,0,0,'type',80);}},
  COPY:{name:'COPY',file:'COPY.COM',c:C.lcyan,
    up:['Copied files orbit around you','+1 file','+5 damage','+1 file, faster spin','+25% radius','+1 file','+8 damage, +1 file'],
    st:l=>({n:2+b(l>=2)+b(l>=4)+b(l>=6)+b(l>=7),dmg:8+5*b(l>=3)+8*b(l>=7),rad:30*(1+.25*b(l>=5)),spin:2.6*(l>=4?1.35:1)}),
    tick(w,s,dt){const n=s.n+P.amount,rad=s.rad*P.area;w.ang=((w.ang||0)+s.spin*P.pspd*dt)%TAU;w.orbs=[];
      for(let i=0;i<n;i++){const a=w.ang+i*TAU/n,x=PL.x+Math.cos(a)*rad,y=PL.y+Math.sin(a)*rad;w.orbs.push({x,y,ch:'COPYFILE'[i%8]});
        query(x,y,6,e=>{if((e.hits.copy??-9)+.35<=S.t){e.hits.copy=S.t;hurt(e,s.dmg,Math.cos(a)*50,Math.sin(a)*50)}});}}},
  DEL:{name:'DEL',file:'DEL.COM',c:C.red,
    up:['Deletes anything that gets too close','+20% radius','+3 damage','+20% radius','-15% tick delay','+4 damage','+20% radius, +4 damage'],
    st:l=>({rad:26*(1+.2*b(l>=2)+.2*b(l>=4)+.2*b(l>=7)),dmg:5+3*b(l>=3)+4*b(l>=6)+4*b(l>=7),tick:.5*(l>=5?.85:1)}),
    tick(w,s,dt){w.rad=s.rad*P.area;w.t2=(w.t2||0)-dt;if(w.t2>0)return;w.t2=s.tick*P.cd;
      query(PL.x,PL.y,w.rad,e=>{const dx=e.x-PL.x,dy=e.y-PL.y,d=Math.hypot(dx,dy)||1;hurt(e,s.dmg,dx/d*30,dy/d*30)});}},
  PING:{name:'PING',file:'PING.EXE',c:C.lgreen,
    up:['Sends packets that home in on targets','+1 packet','+6 damage','+1 packet','-20% delay','+1 packet','+10 damage, +1 pierce'],
    st:l=>({n:1+b(l>=2)+b(l>=4)+b(l>=6),dmg:11+6*b(l>=3)+10*b(l>=7),cd:1.6*(l>=5?.8:1),pierce:1+b(l>=7)}),
    fire(w,s){const n=s.n+P.amount;for(let i=0;i<n;i++)shoot(PL.x,PL.y,Math.random()*TAU,120*P.pspd,{dmg:s.dmg,pierce:s.pierce,s:'»',c:C.lgreen,r:5,home:true,life:3*P.dur,kb:20});
      beep(1400,.04,.012,400,0,'ping',150);}},
  TREE:{name:'TREE',file:'TREE.COM',c:C.yellow,
    up:['Branches strike a random target and chain','+2 branches','+10 damage','-20% delay','+2 branches','+10 damage','+3 branches, -15% delay'],
    st:l=>({ch:3+2*b(l>=2)+2*b(l>=5)+3*b(l>=7),dmg:20+10*b(l>=3)+10*b(l>=6),cd:2.4*(l>=4?.8:1)*(l>=7?.85:1)}),
    fire(w,s){const vis=S.enemies.filter(e=>!e.dead&&Math.abs(e.x-PL.x)<VW/2&&Math.abs(e.y-PL.y)<VH/2);if(!vis.length){w.t=.3;return}
      const reach=(70*P.area)**2;
      for(let k=0;k<1+P.amount;k++){let cur=pick(vis);const pts=[{x:PL.x,y:PL.y}],hit=new Set();
        for(let c=0;c<s.ch&&cur;c++){pts.push({x:cur.x,y:cur.y});hit.add(cur);hurt(cur,s.dmg);
          let best=null,bd=reach;for(const e of S.enemies){if(e.dead||hit.has(e))continue;const d2=(e.x-cur.x)**2+(e.y-cur.y)**2;if(d2<bd){bd=d2;best=e}}cur=best;}
        S.chains.push({pts,life:.35,max:.35});}
      beep(300,.08,.02,-200,0,'tree',120);}},
  DEFRAG:{name:'DEFRAG',file:'DEFRAG.EXE',c:C.lblue,
    up:['Drops fragmented blocks that grind enemies','+1 block','+25% area','+3 damage','+1 block, +30% duration','+3 damage','+1 block, +25% area'],
    st:l=>({n:1+b(l>=2)+b(l>=5)+b(l>=7),rad:18*(1+.25*b(l>=3)+.25*b(l>=7)),dmg:5+3*b(l>=4)+3*b(l>=6),dur:2.6*(l>=5?1.3:1),cd:3.4}),
    fire(w,s){const n=s.n+P.amount;for(let i=0;i<n;i++){const t=S.enemies.length&&Math.random()<.7?pick(S.enemies):null;
        let x,y;if(t&&Math.abs(t.x-PL.x)<VW/2&&Math.abs(t.y-PL.y)<VH/2){x=t.x;y=t.y}else{const a=Math.random()*TAU,r=rand(20,90);x=PL.x+Math.cos(a)*r;y=PL.y+Math.sin(a)*r}
        const d=s.dur*P.dur;S.pools.push({x,y,r:s.rad*P.area,life:d,max:d,dmg:s.dmg,t:0,seed:(Math.random()*999)|0});}}},
  FORMAT:{name:'FORMAT',file:'FORMAT.COM',c:C.white,
    up:['Periodically formats everything around you','+20 damage','-15% delay','+25% radius','+20 damage','-15% delay','+40 damage, +25% radius'],
    st:l=>({dmg:40+20*b(l>=2)+20*b(l>=5)+40*b(l>=7),cd:9*(l>=3?.85:1)*(l>=6?.85:1),rad:130*(1+.25*b(l>=4)+.25*b(l>=7))}),
    fire(w,s){const m=s.rad*P.area;S.rings.push({x:PL.x,y:PL.y,r:0,max:m,spd:m/.6*P.pspd,dmg:s.dmg,hit:new Set()});S.shake=5;beep(90,.5,.05,-60);}},
};
// v2 versions (LEVEL 2 only): 1.6x damage, 20% faster, +1 count where it has one.
// A v2 replaces its base weapon in the same slot (see choices()).
const baseOf=id=>WEAP[id].base||id;
for(const id of Object.keys(WEAP)){const b=WEAP[id];
  WEAP[id+'2']={...b,v2:true,base:id,name:b.name+'2',file:b.file.replace(/\./,'2.'),
    st:l=>{const s={...b.st(l)};if(s.dmg)s.dmg*=1.6;if(s.cd)s.cd*=.8;if(s.tick)s.tick*=.8;if(s.n)s.n++;return s}}}
const PASS={
  '!':{name:'EXCLAIM.SYS',desc:'+10% damage',max:5},
  ';':{name:'SEMICOL.SYS',desc:'-8% weapon delay',max:5},
  ':':{name:'COLON.SYS',desc:'+1 projectile / orbit / strike',max:2},
  '.':{name:'PERIOD.SYS',desc:'+10% move speed',max:5},
  ',':{name:'COMMA.SYS',desc:'+30% pickup range',max:5},
  '"':{name:'QUOTES.SYS',desc:'+10% area',max:5},
  "'":{name:'APOSTR.SYS',desc:'+15% duration, +10% projectile speed',max:5},
  '?':{name:'QUERY.SYS',desc:'+6% critical chance (x2 damage)',max:5},
  '~':{name:'TILDE.SYS',desc:'+0.3 HP per second',max:5},
  '^':{name:'CARET.SYS',desc:'+20 max HP',max:5},
  '`':{name:'BACKTICK.SYS',desc:'+1 armor',max:5},
  '_':{name:'UNDERSC.SYS',desc:'+10% XP gain',max:5},
};

/* ---------- state ---------- */
let state='boot',S=null,PL=null,P=null,T=0,eid=0,frameNo=0;
const K={};
// local save: highest unlocked drive, best run per drive
const SAVE_KEY='dosurv.save';
let SAVE={unlocked:1,best:{}},selLevel=1;
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.unlocked)SAVE=s}catch(e){}
const curLv=()=>LEVELS[selLevel-1];
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE))}catch(e){}}
function recordRun(won){const id=S.lvl.id,b=SAVE.best[id]||{time:0,kills:0,wins:0};
  b.time=Math.max(b.time,S.t);b.kills=Math.max(b.kills,S.kills);
  if(won){b.wins++;if(LEVELS[id])SAVE.unlocked=Math.max(SAVE.unlocked,LEVELS[id].id)}
  SAVE.best[id]=b;writeSave()}
function cycleDrive(){const ids=LEVELS.filter(l=>l.id<=SAVE.unlocked).map(l=>l.id);selLevel=ids[(ids.indexOf(selLevel)+1)%ids.length]}
function xpFor(l){return l<20?5+(l-1)*10:l<40?195+(l-20)*13:455+(l-40)*16}
function lv(k){return S.passives[k]||0}
function recalc(){
  P={dmg:1.1*(1+.1*lv('!')),cd:1-.08*lv(';'),amount:lv(':'),move:1+.1*lv('.'),magnet:32*(1+.3*lv(',')),area:1+.1*lv('"'),
     dur:1+.15*lv("'"),pspd:1.1*(1+.1*lv("'")),crit:.06*lv('?'),regen:.3*lv('~'),armor:lv('`'),growth:1+.1*lv('_')};
  PL.maxHp=100+20*lv('^');PL.hp=Math.min(PL.hp,PL.maxHp);
}
function newGame(L){
  S={lvl:L,walls:new Map(),t:0,kills:0,level:1,xp:0,xpNext:xpFor(1),pending:0,chestQ:[],props:[],chunks:new Set(),bytes:0,buffs:{turbo:0,freeze:0,shield:0},flash:0,seed:(Math.random()*1e6)|0,
     enemies:[],projs:[],gems:[],picks:[],fx:[],texts:[],eb:[],rings:[],pools:[],lines:[],chains:[],
     weapons:[],passives:{},spawnAcc:0,nextElite:45,events:[150,330,510],boss:null,bossSpawned:false,warned:false,
     banner:null,shake:0,hurtFlash:0,winAt:0};
  PL={x:0,y:0,hp:100,maxHp:100,r:5,fx:1,fy:0,hx:1,inv:0};
  recalc();
  S.weapons.push({id:'DIR',lv:1,t:.5});
}
function banner(s,c,d=2.5){S.banner={s,c,life:d,max:d}}

/* ---------- spatial grid ---------- */
const GS=32,grid=new Map();let qid=0;
const gk=(cx,cy)=>(cx+32768)*65536+(cy+32768);
function buildGrid(){
  grid.clear();
  for(const e of S.enemies){if(e.dead)continue;
    const x0=Math.floor((e.x-e.r)/GS),x1=Math.floor((e.x+e.r)/GS),y0=Math.floor((e.y-e.r)/GS),y1=Math.floor((e.y+e.r)/GS);

const CH=256;
function genChunks(){
  // 320px margin so walls exist wherever enemies can spawn (ringPos sits just outside the view)
  const x0=Math.floor((PL.x-VW-320)/CH),x1=Math.floor((PL.x+VW+320)/CH),y0=Math.floor((PL.y-VH-320)/CH),y1=Math.floor((PL.y+VH+320)/CH);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const k=gk(cx,cy);if(S.chunks.has(k))continue;S.chunks.add(k);if(cx===0&&cy===0)continue;genChunk(cx,cy)}
}
function genChunk(cx,cy){
  const r=i=>hash(cx*7+i*131+S.seed,cy*13-i*71+S.seed*3),at=i=>[cx*CH+24+r(i)*208,cy*CH+24+r(i+50)*208];
  if(S.lvl.walls){// up to 3 solid blocks on the 32px cell grid, kept inside this chunk (8x8 cells)
    const wr=i=>hash(cx*11+i*17+S.seed*7,cy*19-i*29+S.seed*5);
    for(let i=0;i<3;i++){if(wr(60+i*5)>=.6)continue;
      let w=1+(wr(61+i*5)*4|0),h=1+(wr(62+i*5)*2|0);if(wr(63+i*5)<.5)[w,h]=[h,w];
      const ox=cx*8+(wr(64+i*5)*(8-w+1)|0),oy=cy*8+(wr(65+i*5)*(8-h+1)|0);
      for(let dx=0;dx<w;dx++)for(let dy=0;dy<h;dy++)S.walls.set(gk(ox+dx,oy+dy),true)}
  }
  // field items never spawn inside a wall
  const n=(r(1)<.3?1:0)+(r(2)<.15?1:0)+(r(3)<.05?1:0);
  for(let i=0;i<n;i++){const [x,y]=at(10+i);if(!wallAt(x,y))S.props.push({k:'tmp',x,y})}
  if(r(4)<.065){const [x,y]=at(20);if(!wallAt(x,y))S.props.push({k:'buried',x,y,prog:0,tick:0})}
  if(r(5)<.025){const [x,y]=at(30);if(!wallAt(x,y))S.picks.push({x,y,k:POWK[(r(31)*POWK.length)|0]})}
  if(r(6)<.09){const [x,y]=at(40);for(let i=0;i<5;i++){const px=x+Math.cos(i/5*TAU)*10,py=y+Math.sin(i/5*TAU)*10;if(!wallAt(px,py))S.picks.push({x:px,y:py,k:'bytes',v:10})}}
}
function collect(p){
  switch(p.k){
    case'heart':PL.hp=Math.min(PL.maxHp,PL.hp+30);floatTxt('+30 HP',C.lred);arp([523,784],.06);break;
    case'magnet':for(const g of S.gems)g.att=true;for(const q of S.picks)if(q.k==='bytes')q.att=true;floatTxt('ATTRIB +M *.*',C.lblue);arp([392,523,659],.05);break;
    case'zip':S.chestQ.push({title:'PKUNZIP.EXE',intro:'Extracting ARCHIVE.ZIP... choose 1 file:',own:true});arp([262,330,392],.06);break;
    case'bytes':S.bytes+=p.v;beep(2000,.03,.015,0,0,'byte',40);break;
    default:powerUp(p.k);
  }
}
function powerUp(k){
  const bf=S.buffs;
  if(k==='turbo'){bf.turbo=10;arp([523,659,784,1047,1319],.04)}
  else if(k==='freeze'){bf.freeze=5;arp([1047,784,523],.06)}
  else if(k==='shield'){bf.shield=6;arp([330,440,330,440],.06)}
  else if(k==='scan'){S.shake=10;S.flash=.25;beep(60,.6,.06,200);
    for(const e of S.enemies){if(e.dead||Math.abs(e.x-PL.x)>VW/2||Math.abs(e.y-PL.y)>VH/2)continue;if(e.boss||e.elite)hurt(e,e.boss?600:400);else kill(e)}}
  banner(POW[k].name,POW[k].c,2);
}
function updateProps(dt){
  let any=false;
  for(const p of S.props){
    const dx=p.x-PL.x,dy=p.y-PL.y;
    if(Math.abs(dx)>VW||Math.abs(dy)>VH)continue;
    if(p.k==='tmp'){
      // .TMP files only break when the player walks over them
      const hit=dx*dx+dy*dy<(PL.r+10)**2;
      if(hit){p.dead=true;any=true;breakTmp(p)}
    }else{
      // buried deleted file: stand on it to UNDELETE
      if(dx*dx+dy*dy<256){p.prog+=dt/1.6;const t=(p.prog*8)|0;if(t!==p.tick){p.tick=t;beep(300+p.prog*900,.04,.02)}}
      else p.prog=Math.max(0,p.prog-dt*.25);
      if(p.prog>=1){p.dead=true;any=true;dig(p)}
    }
  }
  if(any)S.props=S.props.filter(p=>!p.dead);
}
function breakTmp(p){
  const x=p.x,y=p.y,r=Math.random();
  S.fx.push({x,y,c:C.brown,life:.4,max:.4,big:true});beep(500,.05,.025,-300,0,'crate',60);
  if(r<.33)dropGem(x,y,4+((Math.random()*5)|0));
  else if(r<.55){const n=3+((Math.random()*4)|0);for(let i=0;i<n;i++)S.picks.push({x:x+rand(-8,8),y:y+rand(-8,8),k:'bytes',v:10})}
  else if(r<.68)S.picks.push({x,y,k:'heart'});
  else if(r<.75)S.picks.push({x,y,k:'magnet'});
  else if(r<.9)S.picks.push({x,y,k:pick(POWK)});
  else S.texts.push({x,y:y-10,s:'0 bytes',c:C.dgray,life:.8});
}
function dig(p){
  const x=p.x,y=p.y,r=Math.random(),name=pick(TREAS);
  for(let i=0;i<14;i++)S.fx.push({x:x+rand(-24,24),y:y+rand(-24,24),c:pick([C.yellow,C.white,C.lcyan]),life:rand(.3,.9),max:.9});
  arp([523,659,784,1047,784,1047],.07,.045);banner('UNDELETE: '+name+' recovered',C.yellow,2.5);
  const coins=(n,v)=>{for(let i=0;i<n;i++){const a=i/n*TAU;S.picks.push({x:x+Math.cos(a)*14,y:y+Math.sin(a)*14,k:'bytes',v})}};
  if(r<.4){S.chestQ.push({title:'UNDELETE.EXE',intro:`Recovered ${name}! Choose 1 file to keep:`,own:false});coins(6,15)}
  else if(r<.65){coins(16,25);for(let i=0;i<8;i++){const a=i/8*TAU;dropGem(x+Math.cos(a)*24,y+Math.sin(a)*24,6)}}
  else if(r<.85){S.picks.push({x:x-12,y,k:pick(POWK)},{x:x+12,y,k:pick(POWK)});coins(6,15)}
  else{PL.hp=PL.maxHp;floatTxt('HP RESTORED',C.lred);coins(10,20)}
}

/* ---------- render ---------- */

function chainChar(dx,dy){const ax=Math.abs(dx),ay=Math.abs(dy);if(ax>ay*2)return'─';if(ay>ax*2)return'│';return(dx*dy>0)?'\\':'/'}

  for(let gx=gx0;gx<=gx1;gx++)for(let gy=gy0;gy<=gy1;gy++)if(hash(gx,gy)<.16)ctx.fillText('·',gx*32+16,gy*32+16);
  ctx.textAlign='left';ctx.fillStyle='#1d1d1d';
  for(let cx=Math.floor(camX/256)-1;cx<=Math.ceil((camX+VW)/256);cx++)for(let cy=Math.floor(camY/256);cy<=Math.ceil((camY+VH)/256);cy++)
    if(hash(cx+911,cy-37)<.35)ctx.fillText(LIST[Math.floor(hash(cx-5,cy+77)*LIST.length)],cx*256+hash(cx,cy+5)*60,cy*256+8+Math.floor(hash(cy,cx)*14)*16);
  ctx.textAlign='center';

  // walls (LEVEL 2): each 32px cell is a 4x2 block of shade characters
  if(S.walls.size)for(let gx=Math.floor(camX/32);gx<=Math.floor((camX+VW)/32);gx++)for(let gy=Math.floor(camY/32);gy<=Math.floor((camY+VH)/32);gy++)
    if(S.walls.has(gk(gx,gy)))for(let i=0;i<4;i++)for(let j=0;j<2;j++)txt('▓',gx*32+4+i*8,gy*32+8+j*16,C.cyan);

  // defrag pools
  for(const p of S.pools){ctx.globalAlpha=Math.min(1,p.life/.4)*.85;
    const step=Math.floor(T*6);
    for(let y=-p.r;y<=p.r;y+=16)for(let x=-p.r;x<=p.r;x+=8){if(x*x+y*y>p.r*p.r)continue;
      const cxi=Math.round((p.x+x)/8),cyi=Math.round((p.y+y)/16),h=hash(cxi+p.seed,cyi+step);
      ctx.fillStyle=DEFRAG_COL[(h*DEFRAG_COL.length)|0];ctx.fillText('░▒▓█'[(hash(cyi+step,cxi)*4)|0],cxi*8,cyi*16)}}

  if(del&&del.rad){const n=Math.max(10,(TAU*del.rad/10)|0);ctx.fillStyle=C.red;ctx.globalAlpha=.7;
    for(let i=0;i<n;i++){const a=i/n*TAU+T*.6;ctx.fillText('░',PL.x+Math.cos(a)*del.rad,PL.y+Math.sin(a)*del.rad)}ctx.globalAlpha=1}

  // field props
  for(const p of S.props){if(Math.abs(p.x-PL.x)>VW/2+30||Math.abs(p.y-PL.y)>VH/2+30)continue;
    if(p.k==='tmp')txt('[≡]',p.x,p.y,C.brown);
    else{txt('░▒░',p.x,p.y,p.prog>0?C.yellow:C.dgray);if((T+p.x*.01)%1.6<.15)txt('*',p.x+7,p.y-6,C.yellow);
      if(p.prog>0){const f=Math.round(p.prog*8);txt('UNDELETE '+'█'.repeat(f)+'░'.repeat(8-f),p.x,p.y-16,C.yellow)}}}
  // gems and pickups
  for(const g of S.gems)txt('+',g.x,g.y,g.v>=25?C.lmag:g.v>=10?C.yellow:g.v>=3?C.lgreen:C.lcyan);
  for(const p of S.picks){
    if(p.k==='heart')txt('♥',p.x,p.y,C.lred);

    else if(p.k==='bytes')txt('♦',p.x,p.y,C.yellow);
    else if(POW[p.k])txt(POW[p.k].ch,p.x,p.y,(T%.5<.25)?POW[p.k].c:C.white);
    else txt('[ZIP]',p.x,p.y,(T%.5<.25)?C.yellow:C.brown);
  }

  // enemies
  for(const e of S.enemies){
    if(e.boss){drawBoss(e);continue}
    if(e.elite){ctx.font='32px VGA';txt(e.ch,e.x,e.y,e.flash>0?C.white:(T%.3<.15?e.c:C.white));ctx.font='16px VGA';continue}
    txt(e.ch,e.x,e.y,e.flash>0?C.white:(S.buffs.freeze>0?C.lblue:e.c));
  }

  // format rings
  for(const g of S.rings){const n=Math.max(12,(TAU*g.r/9)|0);ctx.globalAlpha=1-g.r/g.max*.7;
    for(let i=0;i<n;i++){const a=i/n*TAU;txt(i%2?'▓':'█',g.x+Math.cos(a)*g.r,g.y+Math.sin(a)*g.r,C.white)}}
  ctx.globalAlpha=1;
  if(S.rings.length){const g=S.rings[S.rings.length-1];txt('Formatting... '+Math.min(100,Math.round(g.r/g.max*100))+'%',PL.x,PL.y-22,C.lgray)}

    const prog=1-l.life/l.max,k=Math.max(1,Math.ceil(nch*Math.min(1,prog*4)));

    for(let i=0;i<ch.pts.length-1;i++){const a=ch.pts[i],b2=ch.pts[i+1],dx=b2.x-a.x,dy=b2.y-a.y,d=Math.hypot(dx,dy),c=chainChar(dx,dy),n=Math.max(1,Math.floor(d/9));
      for(let k=1;k<n;k++)txt(c,a.x+dx*k/n+rand(-1,1),a.y+dy*k/n+rand(-1,1),C.yellow);txt('┼',b2.x,b2.y,C.white)}}
  ctx.globalAlpha=1;

  // projectiles

  // enemy bullets
  for(const q of S.eb)txt(q.ch,q.x,q.y,(T%.2<.1)?q.c:C.white);

  // COPY orbitals
  const cp=S.weapons.find(w=>baseOf(w.id)==='COPY');
  if(cp&&cp.orbs)for(const o of cp.orbs)txt(o.ch,o.x,o.y,C.lcyan);

  // player: blinking square cursor
  const on=(T%.6)<.36,col=PL.inv>0?C.lred:C.white;

  if(on){ctx.fillStyle=col;ctx.fillRect(px,py,9,9)}else{ctx.strokeStyle=PL.inv>0?C.lred:'#555555';ctx.lineWidth=1;ctx.strokeRect(px+.5,py+.5,8,8)}

  if(S.buffs.shield>0&&(S.buffs.shield>1.5||T%.2<.1)){txt('[',PL.x-10,PL.y,C.lcyan);txt(']',PL.x+10,PL.y,C.lcyan)}
  // treasure radar: arrows at the screen edge toward nearby buried files
  for(const p of S.props){if(p.k!=='buried')continue;const dx=p.x-PL.x,dy=p.y-PL.y;

function drawBoss(bs){
  const art=bs.art;
  const x0=bs.x-art[0].length*4,y0=bs.y-art.length*8;
  for(let j=0;j<art.length;j++){const row=art[j];for(let i=0;i<row.length;i++){const ch=row[i];if(ch===' ')continue;
    let c=C.lred;
    if(ch==='o')c=bs.ph2&&T%.3<.15?C.lred:C.yellow;
    else if(j===5||j===6)c=C.white;
    else if(j===8&&'FAIL?'.includes(ch))c=C.yellow;
    else if(ch==='▲')c=C.dgray;
    if(bs.flash>0)c=C.white;

  ctx.fillStyle=C.dgray;for(let i=0;i<20;i++){const a=i/20*TAU;ctx.fillText('░',g.x+Math.cos(a)*g.R,g.y+Math.sin(a)*g.R)}

let lastHud={};
function setBar(id,html){if(lastHud[id]!==html){lastHud[id]=html;$(id).innerHTML=html}}
function pad(s,n){return s.length>n?s.slice(0,n):s+' '.repeat(n-s.length)}
function showBars(v){for(const id of['top','xpb','bot'])$(id).style.display=v?'block':'none';$('bossb').style.display=(v&&S&&S.boss)?'block':'none'}
function updateHud(){
  if(!S||!['play','levelup','chest','pause'].includes(state)){showBars(false);return}
  showBars(true);
  const hf=Math.max(0,Math.round(PL.hp/PL.maxHp*10));
  const hpc=PL.hp/PL.maxHp<.3?'rd':'wh';
  const left=isTouch&&COLS<80?' HP ':` DOSURV.EXE \u2502 HP `;
  const hp=`${'█'.repeat(hf)}${'░'.repeat(10-hf)}`;
  const rest=` ${String(Math.ceil(PL.hp)).padStart(3)}/${PL.maxHp} \u2502 TIME ${fmt(Math.min(S.t,S.lvl.dur))} \u2502 LV ${String(S.level).padStart(2,'0')} \u2502 KILLS ${S.kills} \u2502 BYTES ${S.bytes} `;
  const used=left.length+10+rest.length;
  setBar('top',esc(left)+`<span class="${hpc}">${hp}</span>`+esc(rest)+' '.repeat(Math.max(0,COLS-used)));
  const lab=` XP [`,endl=`] ${String(Math.floor(S.xp)).padStart(4)}/${S.xpNext} `;
  const bw=Math.max(10,COLS-lab.length-endl.length),xf=Math.min(bw,Math.floor(S.xp/S.xpNext*bw));
  setBar('xpb',`<span class="dim">${esc(lab)}</span><span class="cy">${'█'.repeat(xf)}</span><span class="dg">${'░'.repeat(bw-xf)}</span><span class="dim">${esc(endl)}</span>`);
  if(S.boss){const bw2=Math.max(10,COLS-30),f=Math.max(0,Math.ceil(S.boss.hp/S.boss.maxHp*bw2));
    setBar('bossb',` ${S.lvl.boss} [<span class="rd">${'█'.repeat(f)}</span><span class="dg">${'░'.repeat(bw2-f)}</span>] ${String(Math.max(0,Math.ceil(S.boss.hp/S.boss.maxHp*100))).padStart(3)}% `)}
  const wl=S.weapons.map(w=>w.id+':'+w.lv).join(' ');
  const pl=Object.keys(S.passives).map(k=>k+S.passives[k]).join(' ');
  const r=isTouch?`TAP BAR=Pause `:`ESC=Pause  M=Sound${muted?'(off)':''} `;
  const bfs=Object.keys(S.buffs).filter(k=>S.buffs[k]>0).map(k=>`[${k.toUpperCase()} ${Math.ceil(S.buffs[k])}]`).join('');

/* ---------- dialogs ---------- */
let dlg=null;
// word-wrap a dialog row; continuation lines get a 2-space hanging indent
function wrap(t,width){
  if(t.length<=width)return[t];
  const lead=t.match(/^ */)[0],ind=lead+'  ',toks=t.slice(lead.length).match(/\S+\s*/g)||[],out=[];let cur=lead;
  for(const tk of toks){if(cur.trim()&&(cur+tk).trimEnd().length>width){out.push(cur.trimEnd());cur=ind+tk}else cur+=tk}
  out.push(cur.trimEnd());return out.map(l=>l.slice(0,width));

function choices(n,ownedOnly){
  const pool=[];
  for(const id in WEAP){const d=WEAP[id];if(d.v2&&!S.lvl.v2)continue;const w=S.weapons.find(w=>w.id===id);
    if(w){if(w.lv<MAXW)pool.push({k:'w',id,lv:w.lv+1,wt:1.3})}
    else if(d.v2){// a v2 replaces its owned base weapon in the same slot, keeping its level
      const base=S.weapons.find(x=>x.id===d.base);if(base)pool.push({k:'w',id,lv:base.lv,up:d.base,wt:1.6})}
    else if(!ownedOnly&&S.weapons.length<6)pool.push({k:'w',id,lv:1,wt:1})}
  const np=Object.keys(S.passives).length;
  for(const id in PASS){const l=lv(id);
    if(l>0){if(l<PASS[id].max)pool.push({k:'p',id,lv:l+1,wt:1.1})}else if(!ownedOnly&&np<6)pool.push({k:'p',id,lv:1,wt:.8})}
  const out=[];
  while(out.length<n&&pool.length){let tot=pool.reduce((a,o)=>a+o.wt,0),r=Math.random()*tot,i=0;for(;i<pool.length-1;i++){r-=pool[i].wt;if(r<=0)break}out.push(pool.splice(i,1)[0])}
  if(!out.length)out.push({k:'heal'});
  return out;
}

      if(k==='w'||k==='arrowup'){dlg.sel=(dlg.sel+dlg.opts.length-1)%dlg.opts.length;renderDlg()}
      else if(k==='s'||k==='arrowdown'){dlg.sel=(dlg.sel+1)%dlg.opts.length;renderDlg()}
      else if(k>='1'&&k<='9')pickOpt(+k-1);
      else if(k==='enter'||k===' ')pickOpt(dlg.sel);
      break;
    case'dead':if(k==='r')startGame();else if(k==='a'||k==='f')showTitle();break;
    case'win':if(k==='enter'||k===' ')showTitle();break;
  }
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false;if(state==='play')openPause()});
$('scr').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'),act=a&&a.dataset.act;
  if(state==='boot')skipBoot();
  else if(state==='title'){if(act==='help')showHelp(0);else if(act==='sound'){muted=!muted;showTitle()}else if(act==='drive'){cycleDrive();showTitle()}else startGame()}
  else if(state==='help')helpKey('next');
  else if(state==='dead'){if(act==='retry')startGame();else if(act==='abort')showTitle()}
  else if(state==='win')showTitle();
});
for(const id of['top','bot','xpb'])$(id).addEventListener('click',()=>{if(state==='play')openPause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')openPause()});

/* ---------- touch: on-screen stick ---------- */
let touch=null,stickLeft=true;
try{stickLeft=localStorage.getItem('dosurv.stick')!=='right'}catch(e){}
function stickGeo(){const R=Math.max(44,Math.min(80,Math.min(W,H)*.16)),bar=16*UI;return{R,x:stickLeft?R+24:W-R-24,y:H-R-24-bar}}
function tStart(e){e.preventDefault();if(touch)return;const g=stickGeo();
  for(const t of e.changedTouches)if(Math.hypot(t.clientX-g.x,t.clientY-g.y)<g.R*2){touch={id:t.identifier,x:t.clientX,y:t.clientY};break}}
function tMove(e){e.preventDefault();if(!touch)return;for(const t of e.changedTouches)if(t.identifier===touch.id){touch.x=t.clientX;touch.y=t.clientY}}
function tEnd(e){if(!touch)return;for(const t of e.changedTouches)if(t.identifier===touch.id)touch=null}
cv.addEventListener('touchstart',tStart,{passive:false});
cv.addEventListener('touchmove',tMove,{passive:false});
cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  // clamp at 0: the rAF timestamp can predate startGame's last=performance.now(), which made dt negative
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;T+=dt;
  if(state==='play')update(dt);
  if(S&&['play','levelup','chest','pause'].includes(state))render();
  else if(state!=='dead'&&state!=='win'){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height)}
  updateHud();
  requestAnimationFrame(frame);
}
resize();
(document.fonts?document.fonts.load('16px VGA'):Promise.resolve()).catch(()=>{}).then(()=>{runBoot();requestAnimationFrame(frame)});
</script>
